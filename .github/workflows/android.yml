name: Build PHOTO MAGIC AI test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use Android SDK preinstalled on GitHub runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Bundle free local AI model (MediaPipe)
        run: |
          mkdir -p web/vendor/selfie_segmentation
          cp node_modules/@mediapipe/selfie_segmentation/selfie_segmentation* web/vendor/selfie_segmentation/
          test -s web/vendor/selfie_segmentation/selfie_segmentation.js
          test -s web/vendor/selfie_segmentation/selfie_segmentation.tflite
          test -s web/vendor/selfie_segmentation/selfie_segmentation_solution_wasm_bin.wasm
          du -sh web/vendor/selfie_segmentation

      - name: Validate UI and AI server JavaScript
        run: |
          node --check web/free-ai.js
          node --check web/ai-cloud.js
          node --check api/server.mjs
          node --check web/service-worker.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('web/index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html)
          assert len(scripts)>=1 and any('PHOTO_MAGIC_V05' in x for x in scripts)
          Path('/tmp/photo-magic-inline.js').write_text(scripts[0])
          PY
          node --check /tmp/photo-magic-inline.js

      - name: Initialize Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Add native photo gallery saver
        run: |
          mkdir -p android/app/src/main/java/ai/photomagic/studio
          cp android-native/PhotoMagicSavePlugin.java android/app/src/main/java/ai/photomagic/studio/
          cp android-native/MainActivity.java android/app/src/main/java/ai/photomagic/studio/

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PHOTO-MAGIC-AI-test-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
